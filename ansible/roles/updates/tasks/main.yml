- name: Ensure base packages are installed
  ansible.builtin.apt:
    name: "{{ updates_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure automatic security updates are enabled
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Never reboot automatically after unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52platform-unattended.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (role updates).
      Unattended-Upgrade::Automatic-Reboot "{{ updates_automatic_reboot }}";

- name: Ensure the unattended-upgrades service is enabled and running
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: updates_reboot_required

- name: Warn when a reboot is pending
  ansible.builtin.debug:
    msg: "REBOOT EN ATTENTE : le noyau ou une bibliothèque critique a été mis à jour mais n'est pas actif."
  when: updates_reboot_required.stat.exists
