# exclusive: false -> on AJOUTE nos clés sans supprimer les autres. Le nettoyage des clés
# inconnues est une décision séparée, à prendre en connaissance de cause.
- name: Ensure the admin authorized keys are present
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ item.key }}"
    state: present
    exclusive: false
  loop: "{{ admin_authorized_keys }}"
  loop_control:
    label: "{{ item.name }}"
