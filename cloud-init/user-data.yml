#cloud-config
# Amorce d'un VPS neuf : le strict minimum pour qu'Ansible puisse prendre la main.
# Tout le reste (SSH, firewall, mises à jour...) est fait par Ansible, pas ici.
# Les clés ci-dessous sont PUBLIQUES. Garder la liste synchronisée avec
# ansible/roles/accounts/defaults/main.yml (source de vérité).
users:
  - name: ronaldo
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFuuiRwwIwIrACqh9+R8QTJ3hhh8d47yxpZ8g0dPd79w ronaldo.awademe@epitech.eu"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFDtj7egkx/fJV1FIP4eZUBh8QexIVMwvvEN/3DKv5x1 ronaldo breakglass"
package_update: true
packages:
  - python3
  - python3-apt
  - git
# sudo demande un mot de passe : à définir à la main (passwd ronaldo) après le premier accès.
# Il n'est jamais écrit dans ce fichier ni dans Git.
runcmd:
  - [sh, -c, "echo 'cloud-init done' > /var/log/cloud-init-bootstrap.done"]
