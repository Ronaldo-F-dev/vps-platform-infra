- name: Ensure the persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Restart journald

- name: Install the journald limits drop-in
  ansible.builtin.template:
    src: journald-platform.conf.j2
    dest: /etc/systemd/journald.conf.d/10-platform.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Install the host healthcheck script
  ansible.builtin.template:
    src: host-healthcheck.sh.j2
    dest: /usr/local/bin/host-healthcheck
    owner: root
    group: root
    mode: "0755"

- name: Install the healthcheck systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/host-healthcheck.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Host healthcheck (disk, memory, failed units, pending reboot)

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/host-healthcheck
  notify: Reload systemd

- name: Install the healthcheck systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/host-healthcheck.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run the host healthcheck periodically

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec={{ healthcheck_interval }}

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Flush handlers so the timer unit is known before enabling it
  ansible.builtin.meta: flush_handlers

- name: Enable and start the healthcheck timer
  ansible.builtin.systemd:
    name: host-healthcheck.timer
    enabled: true
    state: started
