- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present

# Les règles "allow" passent AVANT l'activation : on ne se coupe jamais de SSH.
- name: Allow the declared ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ firewall_allowed_ports }}"

- name: Remove legacy rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    delete: true
  loop: "{{ firewall_removed_ports }}"

- name: Deny all incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow all outgoing traffic by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable ufw
  community.general.ufw:
    state: enabled
