- name: Ensure fail2ban is installed
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

# Fichier drop-in : on ne touche jamais à jail.conf, fourni par le paquet.
- name: Install the sshd jail configuration
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/10-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
