# Contrôles en lecture seule de K3s : produit les preuves du Projet 2 (à consigner dans docs/test-log.md).
#   ansible-playbook playbooks/k3s-verify.yml -K
- name: Verify the K3s platform
  hosts: vps
  become: true
  gather_facts: false
  tasks:
    - name: Read the installed K3s version
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: verify_k3s_version
      changed_when: false

    - name: Show the exact version (to record in ADR-002)
      ansible.builtin.debug:
        var: verify_k3s_version.stdout_lines

    - name: Read the state of the k3s service
      ansible.builtin.command: systemctl is-active k3s
      register: verify_k3s_active
      changed_when: false
      failed_when: verify_k3s_active.stdout != 'active'

    - name: Read the Ready condition of the node
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl get nodes
        -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}'
      register: verify_k3s_ready
      changed_when: false

    - name: Assert the single node is Ready
      ansible.builtin.assert:
        that:
          - verify_k3s_ready.stdout == 'True'
        success_msg: "Noeud K3s Ready"

    - name: List pods that are neither Running nor Succeeded
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl get pods -A --no-headers
        --field-selector=status.phase!=Running,status.phase!=Succeeded
      register: verify_k3s_bad_pods
      changed_when: false

    - name: Assert that every pod is healthy
      ansible.builtin.assert:
        that:
          - verify_k3s_bad_pods.stdout | trim == ''
        success_msg: "Tous les pods sont Running ou Succeeded"
        fail_msg: "Pods en défaut : {{ verify_k3s_bad_pods.stdout }}"

    - name: Read the secrets encryption status
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
      register: verify_k3s_enc
      changed_when: false

    - name: Assert that secrets are encrypted at rest
      ansible.builtin.assert:
        that:
          - "'Encryption Status: Enabled' in verify_k3s_enc.stdout"
        success_msg: "Secrets chiffrés au repos"
